<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>microcrab · fixture review</title>
    <script>
      /* Opt-in Designer fixture. Same pre-paint theme resolution as index.html,
       * but ?theme= / ?locale= are written first so every scenario URL is stable. */
      (function () {
        var q = new URLSearchParams(location.search);
        try {
          if (q.get("theme"))
            localStorage.setItem("microcrab.ui.theme", q.get("theme"));
          if (q.get("locale"))
            localStorage.setItem("microcrab.ui.locale", q.get("locale"));
        } catch (e) {}
        var pref = "system";
        try {
          var stored = localStorage.getItem("microcrab.ui.theme");
          if (stored === "light" || stored === "dark") pref = stored;
        } catch (e) {}
        var dark =
          pref === "dark" ||
          (pref === "system" &&
            !!(
              window.matchMedia &&
              matchMedia("(prefers-color-scheme: dark)").matches
            ));
        document.documentElement.setAttribute(
          "data-theme",
          dark ? "dark" : "light",
        );
        document.documentElement.setAttribute("data-theme-pref", pref);
      })();
    </script>
  </head>
  <body>
    <div id="main"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
